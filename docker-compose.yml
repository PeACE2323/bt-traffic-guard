# ---------------------------------------------------------------------------
# docker compose 配置
#
# 【重要】GHCR 上的预构建镜像目前尚未发布（CI 尚未启用，原因见 README）。
# 因此这里默认【从源码构建】，保证 `docker compose up -d` 开箱即用。
#
# 两种用法：
#
#   1) 直接构建并启动（推荐，现在就能用）
#        docker compose up -d --build
#
#   2) 若你已在本地用 scripts/build-image.sh 打好镜像，
#      或将来 CI 已启用、可以拉取 GHCR 镜像，则改用：
#        docker compose up -d
#      此时会优先使用下面 image 指定的标签（本地已存在则不重新构建）。
# ---------------------------------------------------------------------------
services:
  bt-traffic-guard:
    # 给构建出的镜像起个名字；也用于「先检查本地是否已有」这一步。
    image: bt-traffic-guard:latest
    build:
      context: .
      args:
        # 国内网络可改成 https://goproxy.cn,direct 加速
        GOPROXY: https://proxy.golang.org,direct
        VERSION: "1.0.0"
    container_name: bt-traffic-guard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 时区影响「自然日/自然周」周期边界的计算，务必设置正确
      TZ: Asia/Shanghai
      # 日志级别：debug / info / warn / error
      BTG_LOG_LEVEL: info

      # ---------------------------------------------------------------------
      # 下面这些连接信息【全部可以不填】。
      #
      # 推荐做法：启动后打开 http://<NAS IP>:8080 → 配置 标签页，
      # 在网页上填写下载器地址与凭据，程序会自动写入 config.yaml。
      #
      # 只有在你想「用环境变量强制覆盖配置文件」时才取消注释。
      # 注意环境变量优先级高于 config.yaml，填了之后网页上改对应项不会生效。
      # ---------------------------------------------------------------------
      # BTG_QBITTORRENT_URL: http://192.168.1.10:8080
      # BTG_QBITTORRENT_API_KEY: qbt_xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # qBittorrent 5.2.0+
      # BTG_QBITTORRENT_USERNAME: admin
      # BTG_QBITTORRENT_PASSWORD: adminadmin
      # BTG_TRANSMISSION_URL: http://192.168.1.10:9091
      # BTG_TRANSMISSION_USERNAME: ""
      # BTG_TRANSMISSION_PASSWORD: ""
      # BTG_WEB_PASSWORD: "改成你自己的密码"   # 设置后自动开启 Web 认证
    volumes:
      # 配置文件目录（首次启动会自动生成 config.yaml）
      - ./config:/config
      # 运行数据目录
      - ./data:/data
    # 若 qBittorrent / Transmission 跑在同一台宿主机上，
    # 用 host 网络模式最省事，配置里可直接写 127.0.0.1。
    # 注意：使用 host 模式时上面的 ports 映射会被忽略。
    # network_mode: host
